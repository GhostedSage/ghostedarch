# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                      GHOSTEDLAND COMPOSITOR CONFIGURATION                  ║
# ║                                                                            ║
# ║  Compositor configuration for Ghosted Arch desktop environment.            ║
# ║  Runs natively or inside a nested window for testing.                      ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# ── Monitor Setup ─────────────────────────────────────────────────────────────
# Automatically detect monitors (or use virtual display when nested)
monitor = , preferred, auto, 1

# ── Input ─────────────────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

# ── General Styling & Layout ──────────────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Ghosted Theme Colors (Ghost Purple & Dark Slate)
    col.active_border = rgba(bd93f9ee) rgba(7b68eeee) 45deg
    col.inactive_border = rgba(282a36aa)

    layout = dwindle
    resize_on_border = true
}

# ── Decoration & Blur ─────────────────────────────────────────────────────────
decoration {
    rounding = 12

    active_opacity = 1.0
    inactive_opacity = 0.94

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(00000044)
    }

    blur {
        enabled = true
        size = 8
        passes = 2
        vibrancy = 0.1696
    }
}

# ── Animations ────────────────────────────────────────────────────────────────
animations {
    enabled = true

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = easeOutQuint, 0.23, 1, 0.32, 1

    animation = windows, 1, 5, myBezier
    animation = windowsOut, 1, 5, default, popin 80%
    animation = border, 1, 6, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 5, easeOutQuint, slide
}

# ── Layout Modes ──────────────────────────────────────────────────────────────
dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# ── Autostart Ghosted Platform Components ─────────────────────────────────────
# Autostart the Ghosted IPC and config daemon
exec-once = ghostedctl daemon
# Launch essential desktop services in phased order (wallpaper -> bar -> control center)
exec-once = ghostedctl session start

# ── Keybindings ───────────────────────────────────────────────────────────────
$mainMod = SUPER

# Application & Platform Launchers
bind = $mainMod, Return, exec, kitty
bind = $mainMod, S, exec, ghosted-settings
bind = $mainMod, I, exec, ghosted-settings
bind = $mainMod, C, exec, ghosted-control-center
bind = $mainMod, A, exec, ghosted-control-center
bind = $mainMod, Space, exec, wofi --show drun || rofi -show drun
bind = $mainMod, D, exec, wofi --show drun || rofi -show drun

# Hardware Media Keys (Audio & Backlight via ghosted-control-center)
bind = , XF86AudioRaiseVolume, exec, ghosted-control-center --volume +5
bind = , XF86AudioLowerVolume, exec, ghosted-control-center --volume -5
bind = , XF86AudioMute, exec, ghosted-control-center --mute-toggle
bind = , XF86MonBrightnessUp, exec, ghosted-control-center --brightness +5
bind = , XF86MonBrightnessDown, exec, ghosted-control-center --brightness -5

# Window Controls
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Focus Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Workspace Switching (1 - 9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move Active Window to Workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9

# Mouse Window Management (Drag to move/resize)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Exit Session (Super + Shift + Q or Super + M) via native Ghosted IPC
bind = $mainMod SHIFT, Q, exec, ghostedctl session exit
bind = $mainMod, M, exec, ghostedctl session exit

# ── Window Rules for Ghosted Applications ─────────────────────────────────────
windowrulev2 = float, class:^(org.ghosted.settings)$
windowrulev2 = size 1024 720, class:^(org.ghosted.settings)$
windowrulev2 = center, class:^(org.ghosted.settings)$
windowrulev2 = animation popin 85%, class:^(org.ghosted.settings)$
windowrulev2 = float, class:^(org.ghosted.control-center)$
windowrulev2 = noanim, class:^(org.ghosted.control-center)$
